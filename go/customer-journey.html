document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

one paper, deep ink text,\n   and a single clay accent used sparingly for indices and emphasis. */\n:root{\n  /* Base palette */\n  --ps-taupe:#8b8074;        /* primary brand surface (headers, hero, footer) */\n  --ps-taupe-deep:#7d7367;   /* deeper taupe (CTA bands, hero photo base) */\n  --ps-bone:#ece7df;         /* warm paper surface */\n  --ps-bone-2:#f4f1ea;       /* lightest paper surface */\n  --ps-cream:#efeae3;        /* light text/foreground on dark surfaces */\n  --ps-ink:#2d2922;          /* near-black warm ink */\n  --ps-ink-soft:#6b655c;     /* muted body text on light surfaces */\n  --ps-clay:#9a6f54;         /* the single accent — indices, eyebrows, errors */\n\n  /* Hairlines */\n  --ps-line:rgba(45,41,34,0.12);          /* divider on light surfaces */\n  --ps-line-light:rgba(239,234,227,0.2);  /* divider on dark surfaces */\n  --ps-line-strong:rgba(45,41,34,0.22);\n\n  /* Semantic aliases — reach for these in product code */\n  --surface-brand:var(--ps-taupe);\n  --surface-brand-deep:var(--ps-taupe-deep);\n  --surface-paper:var(--ps-bone);\n  --surface-paper-2:var(--ps-bone-2);\n  --surface-ink:var(--ps-ink);\n\n  --text-strong:var(--ps-ink);\n  --text-body:var(--ps-ink-soft);\n  --text-on-brand:var(--ps-cream);\n  --text-accent:var(--ps-clay);\n\n  --border-hairline:var(--ps-line);\n  --border-hairline-on-dark:var(--ps-line-light);\n\n  --selection:rgba(45,41,34,0.18);\n}\n<\u002Fstyle>\n<style>/* Porte Studio — Typography tokens\n   An editorial pairing: a single-weight display serif (Marcellus) set large and\n   airy, a light humanist sans (Jost) for body and UI, and an italic Garamond used\n   only to emphasise a word or two inside a serif headline. */\n:root{\n  /* Families */\n  --font-display:'Marcellus', 'Times New Roman', serif;      /* headings, quotes */\n  --font-accent:'Cormorant Garamond', Georgia, serif;        /* italic emphasis */\n  --font-body:'Jost', -apple-system, 'Segoe UI', sans-serif; /* body, UI, labels */\n\n  /* Weights (Jost) */\n  --fw-light:300;   /* @kind font */ /* the workhorse body weight */\n  --fw-regular:400; /* @kind font */\n  --fw-medium:500;  /* @kind font */ /* micro-labels, eyebrows */\n\n  /* Display sizes — Marcellus, line-height ~1.1, letter-spacing ~0.04em.\n     Live site uses fluid clamp() ramps; these are the anchor sizes. */\n  --text-hero:clamp(40px,5vw,76px);     /* page H1 */\n  --text-display:clamp(30px,3.6vw,58px);/* section statements, big quotes */\n  --text-h2:clamp(28px,3vw,44px);\n  --text-h3:23px;                        /* card titles */\n\n  /* Body — Jost light */\n  --text-lead:22px;   /* intro paragraphs, line-height 1.85 */\n  --text-body:20px;   /* standard body, line-height 1.8 */\n  --text-body-sm:16px;/* footer, dense body */\n\n  /* Labels — Jost medium, uppercase, wide tracking */\n  --text-eyebrow:11px;\n  --text-label:10.5px;\n  --text-nav:11.5px;\n\n  /* Tracking scale */\n  --track-eyebrow:0.3em;   /* @kind font */ /* ( SECTION ) labels */\n  --track-nav:0.26em;      /* @kind font */ /* nav items */\n  --track-cta:0.24em;      /* @kind font */ /* buttons */\n  --track-wordmark:0.32em; /* @kind font */ /* PORTE STUDIO wordmark */\n  --track-display:0.04em;  /* @kind font */ /* headings */\n\n  /* Line heights */\n  --lh-tight:1.1;    /* @kind font */\n  --lh-heading:1.2;  /* @kind font */\n  --lh-body:1.8;     /* @kind font */\n  --lh-lead:1.85;    /* @kind font */\n}\n<\u002Fstyle>\n<style>/* Porte Studio — Spacing tokens\n   The layout breathes: generous vertical rhythm on sections, a consistent 6vw page\n   gutter, and a max content width around 1100px. Fine spacing follows a soft scale\n   (not a strict 4/8 grid — values are pulled from the live site). */\n:root{\n  /* Fine scale — component padding, gaps */\n  --space-1:6px;\n  --space-2:9px;\n  --space-3:12px;\n  --space-4:18px;\n  --space-5:22px;\n  --space-6:34px;\n  --space-7:44px;\n  --space-8:54px;\n\n  /* Card padding (service / feature cards) */\n  --pad-card:38px 34px;\n  --pad-card-lg:44px 38px;\n\n  /* Page layout */\n  --page-gutter:6vw;          /* left/right page padding */\n  --content-max:1100px;       /* prose / grid max width */\n  --content-max-wide:1200px;  /* wide feature rows */\n\n  /* Section vertical rhythm (viewport-relative, as on the live site) */\n  --section-y:13vh;\n  --section-y-sm:12vh;\n  --section-y-hero:16vh;\n\n  /* Control sizing */\n  --btn-pad:16px 38px;        /* solid CTA */\n  --field-pad:8px 0;          /* underline input */\n  --tag-pad:8px 15px;         /* pill tag */\n}\n<\u002Fstyle>\n<style>/* Porte Studio — Effects tokens\n   The brand is almost shadowless and hard-cornered. Depth comes from surface colour\n   shifts and hairline dividers, not from rounding or drop shadows. Motion is a slow,\n   uniform cross-fade; hover is a gentle opacity dip; imagery is de-saturated and warm. */\n:root{\n  /* Radii — sharp by default. Only pills/dots are round. */\n  --radius-none:0;\n  --radius-pill:999px;   /* tags, round icon dots */\n  --radius-dot:50%;\n\n  /* Shadows — used only for overlays (mobile menu, hovering imagery). */\n  --shadow-panel:-10px 0 40px rgba(0,0,0,0.2);\n  --shadow-none:none;\n\n  /* Motion — one easing, one duration, applied broadly. */\n  --ease:ease-in-out;                     /* @kind other */\n  --ease-page:cubic-bezier(.2,.7,.2,1);   /* @kind other */ /* page-in / reveal */\n  --dur-fast:.15s;   /* @kind other */\n  --dur:.25s;        /* @kind other */\n  --dur-slow:.3s;    /* @kind other */\n\n  /* Universal transition (the live site applies this to nearly everything) */\n  --transition-base:opacity .25s ease-in-out, background-color .25s ease-in-out,\n    color .25s ease-in-out, border-color .25s ease-in-out, box-shadow .25s ease-in-out; /* @kind other */\n\n  /* Hover opacity steps (named for the live-site .hov-* utilities) */\n  --hover-strong:0.6;   /* @kind other */ /* links, text buttons */\n  --hover-soft:0.82;    /* @kind other */ /* accordion heads */\n  --hover-cta:0.88;     /* @kind other */ /* solid CTAs */\n\n  /* Imagery treatment — warm, de-saturated, slightly darkened.\n     Apply as: filter: var(--img-treatment); */\n  --img-treatment:grayscale(0.5) sepia(0.2) saturate(0.72) contrast(1.08) brightness(0.82); /* @kind other */\n  --img-treatment-hero:grayscale(0.55) sepia(0.22) saturate(0.7) contrast(1.03) brightness(0.74); /* @kind other */\n  --img-scrim:rgba(0,0,0,0.35);   /* overlay on hero imagery for text legibility */\n}\n<\u002Fstyle>\n<style>/* Porte Studio — Design System\n   Root entry point. Consumers link this one file.\n   It is a manifest of @import lines only — all tokens and fonts live in tokens/. */\n/* Porte Studio — Webfonts\n   All three faces are served from Google Fonts, matching the live site.\n   Marcellus  — display / headings (single weight, 400)\n   Cormorant Garamond — italic accent for emphasised words within headings\n   Jost       — body & UI, weights 300 / 400 / 500 */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Cormorant Garamond';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"48c0c0ec-2933-4ea8-9bfd-266be49bcb6a\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Cormorant Garamond';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4a58045e-1122-4da4-a0ec-743c7913aa83\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Cormorant Garamond';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"497ee22a-4441-4b7d-98f9-81673a584b9a\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Cormorant Garamon ;\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"9bca7da9-6f5e-47ca-954b-46853ef54bce\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"1699061f-f934-43a1-8fa7-e7ffdc0d353b\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"5e97209d-06b0-48dd-bc71-559e552f8b07\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"4d07b88a-7cfb-4c69-9ce5-a49bed731870\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1699061f-f934-43a1-8fa7-e7ffdc0d353b\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"5e97209d-06b0-48dd-bc71-559e552f8b07\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4d07b88a-7cfb-4c69-9ce5-a49bed731870\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"1699061f-f934-43a1-8fa7-e7ffdc0d353b\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"5e97209d-06b0-48dd-bc71-559e552f8b07\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"4d07b88a-7cfb-4c69-9ce5-a49bed731870\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Marcellus';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"9791bf5a-1727-4e61-870c-ebf1cecd3bac\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Marcellus';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"60568449-e79b-4810-aa98-8a92686a001c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Porte Studio — Colour tokens\n   A warm, greige editorial palette. Taupe surfaces, bone paper, deep ink text,\n   and a single clay accent used sparingly for indices and emphasis. */\n:root{\n  /* Base palette */\n  --ps-taupe:#8b8074;        /* primary brand surface (headers, hero, footer) */\n  --ps-taupe-deep:#7d7367;   /* deeper taupe (CTA bands, hero photo base) */\n  --ps-bone:#ece7df;         /* warm paper surface */\n  --ps-bone-2:#f4f1ea;       /* lightest paper surface */\n  --ps-cream:#efeae3;        /* light text/foreground on dark surfaces */\n  --ps-ink:#2d2922;          /* near-black warm ink */\n  --ps-ink-soft:#6b655c;     /* muted body text on light surfaces */\n  --ps-clay:#9a6f54;         /* the single accent — indices, eyebrows, errors */\n\n  /* Hairlines */\n  --ps-line:rgba(45,41,34,0.12);          /* divider on light surfaces */\n  --ps-line-light:rgba(239,234,227,0.2);  /* divider on dark surfaces */\n  --ps-line-strong:rgba(45,41,34,0.22);\n\n  /* Semantic aliases — reach for these in product code */\n  --surface-brand:var(--ps-taupe);\n  --surface-brand-deep:var(--ps-taupe-deep);\n  --surface-paper:var(--ps-bone);\n  --surface-paper-2:var(--ps-bone-2);\n  --surface-ink:var(--ps-ink);\n\n  --text-strong:var(--ps-ink);\n  --text-body:var(--ps-ink-soft);\n  --text-on-brand:var(--ps-cream);\n  --text-accent:var(--ps-clay);\n\n  --border-hairline:var(--ps-line);\n  --border-hairline-on-dark:var(--ps-line-light);\n\n  --selection:rgba(45,41,34,0.18);\n}\n\n/* Porte Studio — Typography tokens\n   An editorial pairing: a single-weight display serif (Marcellus) set large and\n   airy, a light humanist sans (Jost) for body and UI, and an italic Garamond used\n   only to emphasise a word or two inside a serif headline. */\n:root{\n  /* Families */\n  --font-display:'Marcellus', 'Times New Roman', serif;      /* headings, quotes */\n  --font-accent:'Cormorant Garamond', Georgia, serif;        /* italic emphasis */\n  --font-body:'Jost', -apple-system, 'Segoe UI', sans-serif; /* body, UI, labels */\n\n  /* Weights (Jost) */\n  --fw-light:300;   /* @kind font */ /* the workhorse body weight */\n  --fw-regular:400; /* @kind font */\n  --fw-medium:500;  /* @kind font */ /* micro-labels, eyebrows */\n\n  /* Display sizes — Marcellus, line-height ~1.1, letter-spacing ~0.04em.\n     Live site uses fluid clamp() ramps; these are the anchor sizes. */\n  --text-hero:clamp(40px,5vw,76px);     /* page H1 */\n  --text-display:clamp(30px,3.6vw,58px);/* section statements, big quotes */\n  --text-h2:clamp(28px,3vw,44px);\n  --text-h3:23px;                        /* card titles */\n\n  /* Body — Jost light */\n  --text-lead:22px;   /* intro paragraphs, line-height 1.85 */\n  --text-body:20px;   /* standard body, line-height 1.8 */\n  --text-body-sm:16px;/* footer, dense body */\n\n  /* Labels — Jost medium, uppercase, wide tracking */\n  --text-eyebrow:11px;\n  --text-label:10.5px;\n  --text-nav:11.5px;\n\n  /* Tracking scale */\n  --track-eyebrow:0.3em;   /* @kind font */ /* ( SECTION ) labels */\n  --track-nav:0.26em;      /* @kind font */ /* nav items */\n  --track-cta:0.24em;      /* @kind font */ /* buttons */\n  --track-wordmark:0.32em; /* @kind font */ /* PORTE STUDIO wordmark */\n  --track-display:0.04em;  /* @kind font */ /* headings */\n\n  /* Line heights */\n  --lh-tight:1.1;    /* @kind font */\n  --lh-heading:1.2;  /* @kind font */\n  --lh-body:1.8;     /* @kind font */\n  --lh-lead:1.85;    /* @kind font */\n}\n\n/* Porte Studio — Spacing tokens\n   The layout breathes: generous vertical rhythm on sections, a consistent 6vw page\n   gutter, and a max content width around 1100px. Fine spacing follows a soft scale\n   (not a strict 4/8 grid — values are pulled from the live site). */\n:root{\n  /* Fine scale — component padding, gaps */\n  --space-1:6px;\n  --space-2:9px;\n  --space-3:12px;\n  --space-4:18px;\n  --space-5:22px;\n  --space-6:34px;\n  --space-7:44px;\n  --space-8:54px;\n\n  /* Card padding (service / feature cards) */\n  --pad-card:38px 34px;\n  --pad-card-lg:44px 38px;\n\n  /* Page layout */\n  --page-gutter:6vw;          /* left/right page padding */\n  --content-max:1100px;       /* prose / grid max width */\n  --content-max-wide:1200px;  /* wide feature rows */\n\n  /* Section vertical rhythm (viewport-relative, as on the live site) */\n  --section-y:13vh;\n  --section-y-sm:12vh;\n  --section-y-hero:16vh;\n\n  /* Control sizing */\n  --btn-pad:16px 38px;        /* solid CTA */\n  --field-pad:8px 0;          /* underline input */\n  --tag-pad:8px 15px;         /* pill tag */\n}\n\n/* Porte Studio — Effects tokens\n   The brand is almost shadowless and hard-cornered. Depth comes from surface colour\n   shifts and hairline dividers, not from rounding or drop shadows. Motion is a slow,\n   uniform cross-fade; hover is a gentle opacity dip; imagery is de-saturated and warm. */\n:root{\n  /* Radii — sharp by default. Only pills/dots are round. */\n  --radius-none:0;\n  --radius-pill:999px;   /* tags, round icon dots */\n  --radius-dot:50%;\n\n  /* Shadows — used only for overlays (mobile menu, hovering imagery). */\n  --shadow-panel:-10px 0 40px rgba(0,0,0,0.2);\n  --shadow-none:none;\n\n  /* Motion — one easing, one duration, applied broadly. */\n  --ease:ease-in-out;                     /* @kind other */\n  --ease-page:cubic-bezier(.2,.7,.2,1);   /* @kind other */ /* page-in / reveal */\n  --dur-fast:.15s;   /* @kind other */\n  --dur:.25s;        /* @kind other */\n  --dur-slow:.3s;    /* @kind other */\n\n  /* Universal transition (the live site applies this to nearly everything) */\n  --transition-base:opacity .25s ease-in-out, background-color .25s ease-in-out,\n    color .25s ease-in-out, border-color .25s ease-in-out, box-shadow .25s ease-in-out; /* @kind other */\n\n  /* Hover opacity steps (named for the live-site .hov-* utilities) */\n  --hover-strong:0.6;   /* @kind other */ /* links, text buttons */\n  --hover-soft:0.82;    /* @kind other */ /* accordion heads */\n  --hover-cta:0.88;     /* @kind other */ /* solid CTAs */\n\n  /* Imagery treatment — warm, de-saturated, slightly darkened.\n     Apply as: filter: var(--img-treatment); */\n  --img-treatment:grayscale(0.5) sepia(0.2) saturate(0.72) contrast(1.08) brightness(0.82); /* @kind other */\n  --img-treatment-hero:grayscale(0.55) sepia(0.22) saturate(0.7) contrast(1.03) brightness(0.74); /* @kind other */\n  --img-scrim:rgba(0,0,0,0.35);   /* overlay on hero imagery for text legibility */\n}\n\n<\u002Fstyle>\n<script src=\"480915bf-c27a-442c-8635-2a4818898975\"><\u002Fscript>\n<style>\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{margin:0;background:var(--ps-bone-2);color:var(--ps-ink);}\n  a{color:var(--ps-ink);text-decoration:none;}\n  a:hover{opacity:0.6;}\n  input,textarea,select{font-family:var(--font-body);}\n  ::selection{background:var(--selection);}\n  @keyframes psSeq{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}\n  .hero-seq{opacity:0;animation:psSeq .6s ease-out forwards;}\n  .hero-seq.d1{animation-delay:.05s;}\n  .hero-seq.d2{animation-delay:.17s;}\n  .hero-seq.d3{animation-delay:.29s;}\n  .hero-seq.d4{animation-delay:.41s;}\n  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease-out, transform .6s ease-out;}\n  .reveal.in{opacity:1;transform:none;}\n  .stag-child{opacity:0;transform:translateY(12px);}\n  .stag-child.in{opacity:1;transform:none;}\n  input,textarea,select{transition:border-color .25s ease-in-out;}\n  input:focus,textarea:focus,select:focus{border-bottom-color:var(--ps-ink) !important;}\n  .pcta{transition:transform .2s ease-in-out, opacity .2s ease-in-out !important;}\n  .pcta:hover{transform:translateY(-2px);}\n  .g-3 > *{display:flex;flex-direction:column;}\n  .g-3 > * > *{flex:1 0 auto;}\n  .jmap-svg{display:block;}\n  .jmap-mobile{display:none;}\n  @keyframes jmPulse{0%{top:2%;opacity:0;}8%{opacity:1;}92%{opacity:1;}100%{top:98%;opacity:0;}}\n  @media (prefers-reduced-motion: reduce){\n    html{scroll-behavior:auto;}\n    .hero-seq,.reveal,.stag-child{opacity:1 !important;transform:none !important;animation:none !important;}\n    .pcta:hover{transform:none;}\n    .jmap-svg [data-pulse]{display:none;}\n    .jm-pulse{display:none;}\n  }\n  @media (max-width:900px){\n    .hero-grid{grid-template-columns:1fr !important;min-height:0 !important;}\n    .hero-left,.hero-right{padding-left:24px !important;padding-right:24px !important;padding-top:80px !important;padding-bottom:80px !important;}\n    .g-3{grid-template-columns:1fr !important;}\n    .trust-3{grid-template-columns:1fr !important;}\n    .gutter{padding-left:24px !important;padding-right:24px !important;}\n    .hero-copy h1{font-size:34px !important;}\n    .sec-h{font-size:28px !important;}\n    .jmap-svg{display:none;}\n    .jmap-mobile{display:block;position:relative;}\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<header class=\"gutter\" style=\"position:{{ headerPosition }};top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;background:var(--ps-taupe);padding:18px 6vw;border-bottom:1px solid var(--ps-line-light)\">\n  <div style=\"font-family:var(--font-body);font-weight:500;font-size:15px;letter-spacing:0.32em;color:var(--ps-cream);text-transform:uppercase\">PORTE STUDIO<\u002Fdiv>\n  <a href=\"#lead-form\" class=\"pcta\" style=\"display:inline-block;background:var(--ps-cream);color:var(--ps-ink);font-family:var(--font-body);font-weight:500;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;padding:12px 24px;white-space:nowrap\" style-hover=\"opacity:0.88\">Book a free journey audit<\u002Fa>\n<\u002Fheader>\n\n<section class=\"hero-grid\" style=\"display:grid;grid-template-columns:1fr 1fr;min-height:92vh;width:100%\">\n  <div class=\"hero-left hero-copy gutter\" style=\"background:var(--ps-taupe);display:flex;flex-direction:column;justify-content:center;padding:120px 5vw\">\n    <div style=\"max-width:660px\">\n      <div class=\"hero-seq d1\" style=\"font-family:var(--font-body);font-weight:500;font-size:13px;letter-spacing:0.42em;text-transform:uppercase;color:var(--ps-cream);opacity:0.8;margin-bottom:36px\">CRM · EMAIL · CUSTOMER LIFECYCLE<\u002Fdiv>\n      <h1 class=\"hero-seq d2\" style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(44px,5.6vw,72px);line-height:1.06;letter-spacing:2px;color:var(--ps-cream);margin:0 0 32px;text-wrap:pretty\">Marketing that responds to every customer, automatically.<\u002Fh1>\n      <p class=\"hero-seq d3\" style=\"font-family:var(--font-body);font-weight:300;font-size:22px;line-height:1.7;color:var(--ps-cream);opacity:0.9;max-width:44ch;margin:0\">We build tailored email and CRM journeys that react to what each customer does, so the right message sends itself and more of them come back to buy again.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hero-right gutter\" style=\"background:var(--ps-bone-2);display:flex;flex-direction:column;justify-content:center;padding:120px 5vw\">\n    <div class=\"hero-seq d4\" style=\"max-width:440px;width:100%\">\n      <div style=\"font-family:var(--font-body);font-weight:500;font-size:13px;letter-spacing:0.3em;text-transform:uppercase;color:var(--ps-clay);margin-bottom:10px\">( FREE JOURNEY AUDIT )<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--ps-ink);margin:0 0 30px;line-height:1.2\">Tell us about your customers<\u002Fh2>\n      <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:flex;flex-direction:column;gap:22px\">\n          <div><div style=\"font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ps-ink-soft);margin-bottom:8px\">Name<\u002Fdiv><input type=\"text\" required=\"\" style=\"width:100%;background:transparent;border:none;border-bottom:1px solid var(--ps-line);padding:8px 0;font-size:16px;font-weight:300;color:var(--ps-ink);outline:none\"><\u002Fdiv>\n          <div><div style=\"font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ps-ink-soft);margin-bottom:8px\">Business name<\u002Fdiv><input type=\"text\" required=\"\" style=\"width:100%;background:transparent;border:none;border-bottom:1px solid var(--ps-line);padding:8px 0;font-size:16px;font-weight:300;color:var(--ps-ink);outline:none\"><\u002Fdiv>\n          <div><div style=\"font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ps-ink-soft);margin-bottom:8px\">Email<\u002Fdiv><input type=\"email\" required=\"\" style=\"width:100%;background:transparent;border:none;border-bottom:1px solid var(--ps-line);padding:8px 0;font-size:16px;font-weight:300;color:var(--ps-ink);outline:none\"><\u002Fdiv>\n          <div><div style=\"font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ps-ink-soft);margin-bottom:8px\">Email or CRM platform <span style=\"opacity:0.5\">(optional)<\u002Fspan><\u002Fdiv><input type=\"text\" placeholder=\"e.g. Mailchimp, Klaviyo\" style=\"width:100%;background:transparent;border:none;border-bottom:1px solid var(--ps-line);padding:8px 0;font-size:16px;font-weight:300;color:var(--ps-ink);outline:none\"><\u002Fdiv>\n          <div><div style=\"font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ps-ink-soft);margin-bottom:8px\">Roughly how many contacts?<\u002Fdiv><sc-raw-select required=\"\" style=\"width:100%;background:transparent;border:none;border-bottom:1px solid var(--ps-line);padding:8px 0;font-size:16px;font-weight:300;color:var(--ps-ink);outline:none;-webkit-appearance:none;appearance:none;cursor:pointer\"><option value=\"\" disabled=\"\" selected=\"\">Select a range<\u002Foption><option>Under 500<\u002Foption><option>500 to 2,000<\u002Foption><option>2,000 to 10,000<\u002Foption><option>10,000+<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n          <button type=\"submit\" class=\"pcta\" style=\"width:100%;margin-top:6px;background:var(--ps-ink);color:var(--ps-cream);font-family:var(--font-body);font-weight:500;font-size:13px;letter-spacing:0.22em;text-transform:uppercase;padding:20px;border:none;cursor:pointer\" style-hover=\"opacity:0.88\">Request my journey audit<\u002Fbutton>\n          <p style=\"font-family:var(--font-body);font-weight:300;font-size:14px;line-height:1.6;color:var(--ps-ink-soft);margin:2px 0 0\">30 minutes. We will map where you are losing customers and show you the fastest journey to build first.<\u002Fp>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-family:var(--font-body);font-weight:300;font-size:16px;line-height:1.7;color:var(--ps-ink);padding:20px 0\">Thank you. We will be in touch shortly to book your free journey audit.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"gutter trust-wrap\" style=\"background:var(--ps-taupe-deep);color:var(--ps-cream);padding:0 6vw;border-top:1px solid var(--ps-line-light)\">\n  <div class=\"trust-3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px\">\n    <div style=\"padding:64px 34px 40px\">\n      <div style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(44px,5vw,66px);line-height:1;color:var(--ps-cream);letter-spacing:1px\"><span data-count=\"3\" data-suffix=\"×\">0<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:var(--font-body);font-weight:300;font-size:16px;line-height:1.6;color:var(--ps-cream);opacity:0.82;margin-top:14px;max-width:26ch\">more repeat purchases from a single automated journey<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:64px 34px 40px;box-shadow:1px 0 0 var(--ps-line-light),-1px 0 0 var(--ps-line-light)\">\n      <div style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(44px,5vw,66px);line-height:1;color:var(--ps-cream);letter-spacing:1px\"><span data-count=\"6\" data-suffix=\" hrs / wk\">0<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:var(--font-body);font-weight:300;font-size:16px;line-height:1.6;color:var(--ps-cream);opacity:0.82;margin-top:14px;max-width:26ch\">saved by letting the follow-up run itself<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:64px 34px 40px\">\n      <div style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(44px,5vw,66px);line-height:1;color:var(--ps-cream);letter-spacing:1px\"><span data-count=\"14\" data-suffix=\" days\">0<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:var(--font-body);font-weight:300;font-size:16px;line-height:1.6;color:var(--ps-cream);opacity:0.82;margin-top:14px;max-width:26ch\">live from kick-off to your journey switched on<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--ps-line-light);padding:38px 0 64px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px 34px;align-items:center;margin-bottom:26px\">\n      <span style=\"font-family:var(--font-body);font-weight:500;font-size:13px;letter-spacing:0.3em;text-transform:uppercase;color:var(--ps-cream);opacity:0.6\">Built on<\u002Fspan>\n      <span style=\"font-family:var(--font-body);font-weight:400;font-size:15px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ps-cream)\">Klaviyo<\u002Fspan>\n      <span style=\"font-family:var(--font-body);font-weight:400;font-size:15px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ps-cream)\">Mailchimp<\u002Fspan>\n      <span style=\"font-family:var(--font-body);font-weight:400;font-size:15px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ps-cream)\">HubSpot<\u002Fspan>\n      <span style=\"font-family:var(--font-body);font-weight:400;font-size:15px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ps-cream)\">ActiveCampaign<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--font-body);font-weight:300;font-size:16px;line-height:1.7;color:var(--ps-cream);opacity:0.82;margin:0;max-width:62ch\">You work directly with the founder, not a junior account manager. The person who scopes the journey is the person who builds it.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"gutter\" style=\"background:var(--ps-bone-2);padding:120px 6vw\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <x-import component-from-global-scope=\"PorteStudioDesignSystem_c861fe.Eyebrow\" tone=\"muted\" hint-size=\"auto,16px\">THE PROBLEM<\u002Fx-import>\n    <h2 class=\"sec-h\" style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1.2;color:var(--ps-ink);margin:20px 0 0;text-wrap:pretty;max-width:20ch\">Sending everyone the same email leaves money on the table.<\u002Fh2>\n    <div style=\"max-width:700px;margin:44px 0 0;display:flex;flex-direction:column;gap:26px\">\n      <p style=\"font-family:var(--font-body);font-weight:300;font-size:18px;line-height:1.85;color:var(--ps-ink-soft);margin:0\">Most businesses do one of two things after a sale: go quiet, or blast their whole list the same newsletter. The new customer, the loyal regular and the person who never bought all get the identical message, so none of it really lands. Meanwhile the obvious next purchase never gets offered.<\u002Fp>\n      <p style=\"font-family:var(--font-body);font-weight:300;font-size:18px;line-height:1.85;color:var(--ps-ink-soft);margin:0\">It is like filling a bath with the plug pulled out. You keep topping it up with new customers while the ones already in there quietly drain away. Winning a customer costs several times more than keeping one, so every ignored regular and every missed upsell is money left on the table.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"gutter\" style=\"background:var(--ps-taupe);color:var(--ps-cream);padding:120px 6vw\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <x-import component-from-global-scope=\"PorteStudioDesignSystem_c861fe.Eyebrow\" tone=\"onDark\" hint-size=\"auto,16px\">CLIENT RESULTS<\u002Fx-import>\n    <div style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(40px,6vw,72px);line-height:1.05;color:var(--ps-cream);letter-spacing:1px;margin:20px 0 8px;text-wrap:pretty;max-width:16ch\">Increased upsells by 150% after going live.<\u002Fdiv>\n    <div style=\"max-width:700px;margin:40px 0 0\">\n      <p style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(22px,2.6vw,30px);line-height:1.45;color:var(--ps-cream);margin:0;text-wrap:pretty\">The marketing journeys Porte Studio built paid for themselves in the first month after going live. Our upsells increased by 150%. Our customers are buying more, with less effort from our sales team.<\u002Fp>\n      <div style=\"font-family:var(--font-body);font-weight:400;font-size:15px;letter-spacing:0.04em;color:var(--ps-cream);margin-top:20px\">— Willinvest<\u002Fdiv>\n      <div style=\"margin-top:44px\"><a href=\"#lead-form\" class=\"pcta\" style=\"display:inline-block;background:var(--ps-ink);color:var(--ps-cream);font-family:var(--font-body);font-weight:500;font-size:13px;letter-spacing:0.22em;text-transform:uppercase;padding:21px 44px\" style-hover=\"opacity:0.88\">Book a free journey audit<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"gutter\" style=\"background:var(--ps-bone-2);padding:120px 6vw\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <x-import component-from-global-scope=\"PorteStudioDesignSystem_c861fe.Eyebrow\" tone=\"muted\" hint-size=\"auto,16px\">THE OFFER<\u002Fx-import>\n    <h2 class=\"sec-h\" style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1.2;color:var(--ps-ink);margin:20px 0 0;text-wrap:pretty;max-width:20ch\">Journeys built around what your customers actually do.<\u002Fh2>\n    <div style=\"max-width:700px;margin:44px 0 0\">\n      <p style=\"font-family:var(--font-body);font-weight:300;font-size:18px;line-height:1.8;color:var(--ps-ink-soft);margin:0\">We design and build automated journeys tailored to each customer's behaviour, what they buy, where they are and how they engage, so the right message sends itself and every customer is guided toward the next purchase, without you lifting a finger.<\u002Fp>\n      <div style=\"font-family:var(--font-body);font-weight:500;font-size:13px;letter-spacing:0.3em;text-transform:uppercase;color:var(--ps-ink-soft);margin:44px 0 6px\">What we set up together<\u002Fdiv>\n      <div data-stagger=\"\" style=\"border-top:1px solid var(--ps-line)\">\n        <div style=\"display:flex;gap:26px;padding:24px 0;border-bottom:1px solid var(--ps-line);align-items:baseline\">\n          <div style=\"font-family:var(--font-display);color:var(--ps-clay);font-size:15px;letter-spacing:0.1em;min-width:30px\">01<\u002Fdiv>\n          <div style=\"font-family:var(--font-body);font-weight:300;font-size:18px;line-height:1.6;color:var(--ps-ink)\">A tailored journey designed to drive early value and the first repeat purchase<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:26px;padding:24px 0;border-bottom:1px solid var(--ps-line);align-items:baseline\">\n          <div style=\"font-family:var(--font-display);color:var(--ps-clay);font-size:15px;letter-spacing:0.1em;min-width:30px\">02<\u002Fdiv>\n          <div style=\"font-family:var(--font-body);font-weight:300;font-size:18px;line-height:1.6;color:var(--ps-ink)\">Clean, segmented lists so people only get messages that actually fit them<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:26px;padding:24px 0;border-bottom: lor:var(--ps-ink);margin:20px 0 0;text-wrap:pretty;max-width:20ch\">One trigger, tailored routes, one loyal customer.<\u002Fh2>\n    <p style=\"font-family:var(--font-body);font-weight:300;font-size:18px;line-height:1.8;color:var(--ps-ink-soft);margin:32px 0 52px;max-width:640px\">See exactly how each customer is routed by what they do, from the first touch to coming back again.<\u002Fp>\n    <div class=\"jmap\" style=\"margin-top:8px\">\n      <svg class=\"jmap-svg\" sc-camel-view-box=\"0 0 1180 520\" role=\"img\" aria-label=\"Branching customer journey: one new-customer trigger splits into three behaviour-based routes that all converge on retention.\" style=\"width:100%;height:auto;overflow:visible\">\n        <g stroke=\"#2d2922\" stroke-opacity=\"0.16\" stroke-width=\"1.2\" fill=\"none\">\n          <path d=\"M120,260 L433,120 L746,120 L1060,260\"><\u002Fpath>\n          <path d=\"M120,260 L433,260 L746,260 L1060,260\"><\u002Fpath>\n          <path d=\"M120,260 L433,400 L746,400 L1060,260\"><\u002Fpath>\n        <\u002Fg>\n        <g data-pulse=\"\">\n          <circle r=\"11\" fill=\"#a98c7d\" opacity=\"0.32\"><\u002Fcircle>\n          <circle r=\"4\" fill=\"#2d2922\"><\u002Fcircle>\n          <animateMotion dur=\"4.4s\" begin=\"0s\" sc-camel-repeat-count=\"indefinite\" rotate=\"0\" path=\"M120,260 L433,120 L746,120 L1060,260\"><\u002FanimateMotion>\n        <\u002Fg>\n        <g data-pulse=\"\">\n          <circle r=\"11\" fill=\"#a98c7d\" opacity=\"0.32\"><\u002Fcircle>\n          <circle r=\"4\" fill=\"#2d2922\"><\u002Fcircle>\n          <animateMotion dur=\"4.4s\" begin=\"1.3s\" sc-camel-repeat-count=\"indefinite\" rotate=\"0\" path=\"M120,260 L433,260 L746,260 L1060,260\"><\u002FanimateMotion>\n        <\u002Fg>\n        <g data-pulse=\"\">\n          <circle r=\"11\" fill=\"#a98c7d\" opacity=\"0.32\"><\u002Fcircle>\n          <circle r=\"4\" fill=\"#2d2922\"><\u002Fcircle>\n          <animateMotion dur=\"4.4s\" begin=\"2.6s\" sc-camel-repeat-count=\"indef ily:var(--font-body);font-weight:500;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ps-clay);margin-bottom:8px\">Route B · Day 4<\u002Fdiv>\n            <div style=\"font-family:var(--font-display);font-size:19px;color:var(--ps-ink)\">Buys Product B<\u002Fdiv>\n            <div style=\"font-family:var(--font-body);font-weight:300;font-size:14px;color:var(--ps-ink-soft);margin-top:4px\">Day 4 ask for review<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--ps-bone-2);border:1px solid var(--ps-line);padding:20px\">\n            <div style=\"font-family:var(--font-body);font-weight:500;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ps-clay);margin-bottom:8px\">Route C · Day 7<\u002Fdiv>\n            <div style=\"font-family:var(--font-display);font-size:19px;color:var(--ps-ink)\">No purchase yet<\u002Fdiv>\n            <div style=\"font-family:var(--font-body);font-weight:300;font-size:14px;color:var(--ps-ink-soft);margin-top:4px\">Day 7 first offer<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--ps-taupe);padding:20px\">\n            <div style=\"font-family:var(--font-body);font-weight:500;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ps-clay);margin-bottom:8px\">Retention<\u002Fdiv>\n            <div style=\"font-family:var(--font-display);font-size:19px;color:var(--ps-cream)\">In the loop<\u002Fdiv>\n            <div style=\"font-family:var(--font-body);font-weight:300;font-size:14px;color:var(--ps-cream);opacity:0.85;margin-top:4px\">Kept coming back<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"gutter\" style=\"background:var(--ps-taupe);color:var(--ps-cream);padding:120px 6vw\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <x-import component-from-global-scope=\"PorteStudioDesignSystem_c861fe.Eyebrow\" tone=\"onDark\" hint-size=\"auto,16px\">WHY PORTE STUDIO<\u002Fx-import>\n    <div style=\"max-width:820px;margin:32px 0 0\">\n      <p style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(24px,2.8vw,34px);line-height:1.4;color:var(--ps-cream);margin:0;text-wrap:pretty\">We treat email as a sales conversation, not a newsletter. Coming from a sales and marketing background, we build journeys around the moments that actually move someone to buy again, and we write them to sound like a person, not a promotion.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"gutter\" style=\"background:var(--ps-bone);padding:120px 6vw\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <x-import component-from-global-scope=\"PorteStudioDesignSystem_c861fe.Eyebrow\" tone=\"muted\" hint-size=\"auto,16px\">WHAT IS NEXT<\u002Fx-import>\n    <h2 class=\"sec-h\" style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1.2;color:var(--ps-ink);margin:20px 0 0;text-wrap:pretty;max-width:20ch\">One journey is just the start.<\u002Fh2>\n    <div style=\"max-width:700px;margin:44px 0 0\">\n      <p style=\"font-family:var(--font-body);font-weight:300;font-size:18px;line-height:1.85;color:var(--ps-ink-soft);margin:0\">One journey proves what tailored automation can do. From there we map your whole lifecycle: onboarding, cross-sell, retention, win-back, reviews and referrals, each branch firing on the right behaviour. Start with one, build the full engine when you see the returns.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"gutter\" style=\"background:var(--ps-bone-2);padding:120px 6vw\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <x-import component-from-global-scope=\"PorteStudioDesignSystem_c861fe.Eyebrow\" tone=\"muted\" hint-size=\"auto,16px\">QUESTIONS<\u002Fx-import>\n    <h2 class=\"sec-h\" style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1.2;color:var(--ps-ink);margin:20px 0 0;text-wrap:pretty;max-width:20ch\">Frequently asked.<\u002Fh2>\n    <div style=\"max-width:700px;margin:44px 0 0\">\n      <div data-stagger=\"\" style=\"border-top:1px solid var(--ps-line)\">\n        <div style=\"padding:28px 0;border-bottom:1px solid var(--ps-line)\">\n          <div style=\"font-family:var(--font-display);font-size:21px;color:var(--ps-ink);margin-bottom:12px\">Which email platform do you work with?<\u002Fdiv>\n          <div style=\"font-family:var(--font-body);font-weight:300;font-size:16px;line-height:1.75;color:var(--ps-ink-soft)\">We work with the major platforms including Mailchimp, Klaviyo, ActiveCampaign, HubSpot and more. If you have not chosen one yet, we will recommend the right fit.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:28px 0;border-bottom:1px solid var(--ps-line)\">\n          <div style=\"font-family:var(--font-display);font-size:21px;color:var(--ps-ink);margin-bottom:12px\">We do not have a big list. Is this worth it?<\u002Fdiv>\n          <div style=\"font-family:var(--font-body);font-weight:300;font-size:16px;line-height:1.75;color:var(--ps-ink-soft)\">Yes. A small, well looked after list often outperforms a large neglected one. The earlier you build good journeys, the more every future subscriber is worth.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:28px 0;border-bottom:1px solid var(--ps-line)\">\n          <div style=\"font-family:var(--font-display);font-size:21px;color:var(--ps-ink);margin-bottom:12px\">Will this feel spammy to our customers?<\u002Fdiv>\n          <div style=\"font-family:var(--font-body);font-weight:300;font-size:16px;line-height:1.75;color:var(--ps-ink-soft)\">No. Tailored journeys send fewer, more relevant messages. Done well, customers look forward to them.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:28px 0;border-bottom:1px solid var(--ps-line)\">\n          <div style=\"font-family:var(--font-display);font-size:21px;color:var(--ps-ink);margin-bottom:12px\">How soon will we see results?<\u002Fdiv>\n          <div style=\"font-family:var(--font-body);font-weight:300;font-size:16px;line-height:1.75;color:var(--ps-ink-soft)\">The moment a journey goes live it starts working, on every customer whose behaviour triggers it.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"gutter\" style=\"background:var(--ps-ink);color:var(--ps-cream);padding:120px 6vw\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <div style=\"max-width:700px\">\n      <div style=\"font-family:var(--font-body);font-weight:500;font-size:13px;letter-spacing:0.42em;text-transform:uppercase;color:var(--ps-cream);opacity:0.6;margin-bottom:26px\">( BOOK YOUR AUDIT )<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(32px,4.4vw,52px);line-height:1.14;color:var(--ps-cream);letter-spacing:1px;margin:0 0 22px\">Let’s keep your customers coming back.<\u002Fh2>\n      <p style=\"font-family:var(--font-body);font-weight:300;font-size:18px;line-height:1.75;color:var(--ps-cream);opacity:0.88;max-width:52ch;margin:0 0 40px\">Book a free 30 minute journey audit. We will show you exactly where customers are dropping off and the first journey to build.<\u002Fp>\n      <a href=\"#lead-form\" class=\"pcta\" style=\"display:inline-block;background:var(--ps-cream);color:var(--ps-ink);font-family:var(--font-body);font-weight:500;font-size:13px;letter-spacing:0.22em;text-transform:uppercase;padding:21px 46px\" style-hover=\"opacity:0.88\">Book a free journey audit<\u002Fa>\n      <p style=\"font-family:var(--font-body);font-weight:300;font-size:14px;line-height:1.6;color:var(--ps-cream);opacity:0.65;max-width:46ch;margin:24px 0 0\">We only build a handful of new journeys each month so each one gets done properly.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"lead-form\" class=\"gutter\" style=\"background:var(--ps-bone);padding:120px 6vw;scroll-margin-top:80px\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <div style=\"max-width:620px\">\n      <div style=\"margin-bottom:44px\">\n        <div style=\"font-family:var(--font-body);font-weight:500;font-size:13px;letter-spacing:0.3em;text-transform:uppercase;color:var(--ps-clay);margin-bottom:14px\">( FREE JOURNEY AUDIT )<\u002Fdiv>\n        <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(28px,3.4vw,38px);line-height:1.18;color:var(--ps-ink);margin:0 0 12px\">Tell us about your customers<\u002Fh2>\n        <p style=\"font-family:var(--font-body);font-weight:300;font-size:15px;line-height:1.7;color:var(--ps-ink-soft);margin:0\">30 minutes. We will map where you are losing customers and show you the fastest journey to build first.<\u002Fp>\n      <\u002Fdiv>\n      <sc-if value=\"{{ notSent2 }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ onSubmit2 }}\" style=\"display:flex;flex-direction:column;gap:28px\">\n          <div><div style=\"font-size:13px;letter-spacing:0.24em;text-transform:uppercase;color:var(--ps-ink-soft);margin-bottom:10px\">Name<\u002Fdiv><input type=\"text\" required=\"\" style=\"width:100%;background:transparent;border:none;border-bottom:1px solid var(--ps-line);padding:8px 0;font-size:18px;font-weight:300;color:var(--ps-ink);outline:none\"><\u002Fdiv>\n          <div><div style=\"font-size:13px;letter-spacing:0.24em;text-transform:uppercase;color:var(--ps-ink-soft);margin-bottom:10px\">Business name<\u002Fdiv><input type=\"text\" required=\"\" style=\"width:100%;background:transparent;border:none;border-bottom:1px solid var(--ps-line);padding:8px 0;font-size:18px;font-weight:300;color:var(--ps-ink);outline:none\"><\u002Fdiv>\n          <div><div style=\"font-size:13px;letter-spacing:0.24em;text-transform:uppercase;color:var(--ps-ink-soft);margin-bottom:10px\">Email<\u002Fdiv><input type=\"email\" required=\"\" style=\"width:100%;background:transparent;border:none;border-bottom:1px solid var(--ps-line);padding:8px 0;font-size:18px;font-weight:300;color:var(--ps-ink);outline:none\"><\u002Fdiv>\n          <div><div style=\"font-size:13px;letter-spacing:0.24em;text-transform:uppercase;color:var(--ps-ink-soft);margin-bottom:10px\">Email or CRM platform <span style=\"opacity:0.5\">(optional)<\u002Fspan><\u002Fdiv><input type=\"text\" placeholder=\"e.g. Mailchimp, Klaviyo\" style=\"width:100%;background:transparent;border:none;border-bottom:1px solid var(--ps-line);padding:8px 0;font-size:18px;font-weight:300;color:var(--ps-ink);outline:none\"><\u002Fdiv>\n          <div><div style=\"font-size:13px;letter-spacing:0.24em;text-transform:uppercase;color:var(--ps-ink-soft);margin-bottom:10px\">Roughly how many contacts?<\u002Fdiv><sc-raw-select required=\"\" style=\"width:100%;background:transparent;border:none;border-bottom:1px solid var(--ps-line);padding:8px 0;font-size:18px;font-weight:300;color:var(--ps-ink);outline:none;-webkit-appearance:none;appearance:none;cursor:pointer\"><option value=\"\" disabled=\"\" selected=\"\">Select a range<\u002Foption><option>Under 500<\u002Foption><option>500 to 2,000<\u002Foption><option>2,000 to 10,000<\u002Foption><option>10,000+<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n          <button type=\"submit\" class=\"pcta\" style=\"width:100%;margin-top:10px;background:var(--ps-ink);color:var(--ps-cream);font-family:var(--font-body);font-weight:500;font-size:13px;letter-spacing:0.22em;text-transform:uppercase;padding:20px;border:none;cursor:pointer\" style-hover=\"opacity:0.88\">Request my journey audit<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sent2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border-top:1px solid var(--ps-line);padding:40px 0\">\n          <div style=\"font-family:var(--font-display);font-size:26px;color:var(--ps-ink);margin-bottom:14px\">Thank you.<\u002Fdiv>\n          <div style=\"font-family:var(--font-body);font-weight:300;font-size:16px;line-height:1.7;color:var(--ps-ink-soft)\">We will be in touch shortly to book your free journey audit.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:var(--ps-taupe);color:var(--ps-cream);padding:64px 6vw 54px;text-align:center\">\n  <div style=\"font-family:var(--font-display);font-weight:400;font-size:26px;letter-spacing:1px;color:var(--ps-cream);margin-bottom:16px\">Porte Studio<\u002Fdiv>\n  <div style=\"font-family:var(--font-body);font-weight:500;font-size:13px;letter-spacing:0.36em;text-transform:uppercase;color:var(--ps-cream);opacity:0.7\">STRATEGY · BRAND · COMMUNICATIONS<\u002Fdiv>\n  <div style=\"font-family:var(--font-body);font-weight:300;font-size:12px;color:var(--ps-cream);opacity:0.55;margin-top:34px\">© Porte Studio. Boutique marketing consultancy.<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;stickyHeader&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;,&quot;label&quot;:&quot;Sticky header&quot;}}\">\nclass Component extends DCLogic {\n  state = { sent: false, sent2: false };\n  componentDidMount() {\n    const q = (s) => Array.from(document.querySelectorAll(s));\n    const nums = q('[data-count]');\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce) { nums.forEach(n => { n.textContent = n.dataset.count + (n.dataset.suffix || ''); }); return; }\n    const foot = document.querySelector('footer');\n    const targets = q('section').slice(1).concat(foot ? [foot] : []);\n    targets.forEach(t => t.classList.add('reveal'));\n    q('[data-stagger] > *').forEach(c => c.classList.add('stag-child'));\n    const io = new IntersectionObserver((es) => {\n      es.forEach(e => {\n        if (!e.isIntersecting) return;\n        e.target.classList.add('in');\n        io.unobserve(e.target);\n        Array.from(e.target.querySelectorAll('.stag-child')).forEach((c, i) => {\n          c.style.transition = 'opacity .5s ease-out, transform .5s ease-out';\n          c.style.transitionDelay = (i * 55) + 'ms';\n          c.classList.add('in');\n        });\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n    targets.forEach(t => io.observe(t));\n    const cio = new IntersectionObserver((es) => {\n      es.forEach(e => { if (e.isIntersecting) { this.countUp(e.target); cio.unobserve(e.target); } });\n    }, { threshold: 0.6 });\n    nums.forEach(n => cio.observe(n));\n  }\n  countUp(el) {\n    const target = parseInt(el.dataset.count, 10);\n    const suf = el.dataset.suffix || '';\n    const dur = 1300, t0 = performance.now();\n    const step = (t) => {\n      const p = Math.min(1, (t - t0) / dur);\n      const e = 1 - Math.pow(1 - p, 3);\n      el.textContent = Math.round(e * target) + suf;\n      if (p < 1) requestAnimationFrame(step);\n      else el.textContent = target + suf;\n    };\n    requestAnimationFrame(step);\n  }\n  renderVals() {\n    return {\n      headerPosition: this.props.stickyHeader === false ? 'relative' : 'sticky',\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      sent2: this.state.sent2,\n      notSent2: !this.state.sent2,\n      onSubmit: (e) => { e.preventDefault(); this.setState({ sent: true }); },\n      onSubmit2: (e) => { e.preventDefault(); this.setState({ sent2: true }); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
